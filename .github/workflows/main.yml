name: Docker CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t nit07/qr-code -f src/Dockerfile.dev .
      
    - name: Run tests
      run: docker run nit07/qr-code npm test
