version: '3'
services:
  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
      - .:/app
  tests:
    build: 
      context: .
      dockerfile: src/Dockerfile.dev
    volumes:
      - /app/node_modules
      - .:/app
    command: ["npm","run","tests"]
